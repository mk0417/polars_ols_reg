[package]
name = "polars_ols_reg"
version = "0.1.0"
edition = "2021"

[lib]
name = "_polars_ols_reg"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["dtype-struct"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28.0", features = ["derive", "dtype-struct"] }
serde = { version = "1", features = ["derive"] }
nalgebra = "0.34"
statrs = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
